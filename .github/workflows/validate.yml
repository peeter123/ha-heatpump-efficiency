name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: scripts/lint.py
      - name: Run the lint entry point
        run: python scripts/lint.py

  ha-tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: .github/workflows/validate.yml
      - name: Run the Home Assistant tests
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.375
          pytest tests_ha --cov=custom_components.heatpump_efficiency --cov-branch --cov-report=term-missing
      - name: Require full coverage of the config flow
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.375
          coverage report --include="*/config_flow.py" --fail-under=100

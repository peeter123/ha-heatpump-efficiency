name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: scripts/lint.py
      - name: Run the lint entry point
        run: python scripts/lint.py

  ha-tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: .github/workflows/validate.yml
      - name: Run the Home Assistant tests
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant==2026.11.2
          --with pytest-cov==7.1.0
          --with coverage==7.16.2
          pytest tests_ha -p no:respx
          --cov=custom_components/heatpump_efficiency --cov-branch --cov-report=
      - name: Run the tests of the pure modules and add their coverage
        run: >-
          uv run --no-project --python 3.14
          --with pytest==9.0.3
          --with pytest-asyncio==1.4.0
          --with tzdata==2026.6
          --with pytest-cov==7.1.0
          --with coverage==7.16.2
          pytest tests
          --cov=custom_components/heatpump_efficiency --cov-branch --cov-append --cov-report=term-missing
      - name: Require full coverage of the config flow
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant==2026.11.2
          --with pytest-cov==7.1.0
          --with coverage==7.16.2
          coverage report --include="*/config_flow.py" --fail-under=100
      - name: Write the JSON coverage report
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant==2026.11.2
          --with pytest-cov==7.1.0
          --with coverage==7.16.2
          coverage json -o coverage.json
      - name: Require 95 % coverage of the integration and of every module
        run: python scripts/coverage_gate.py coverage.json 95
